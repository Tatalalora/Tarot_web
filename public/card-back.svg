<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 516" width="300" height="516">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="3" fill="#ffffff" opacity="0.55"/>
    </pattern>
    <clipPath id="inner">
      <rect x="22" y="22" width="256" height="472" rx="18"/>
    </clipPath>
  </defs>
  <rect width="300" height="516" rx="24" fill="#d8c8f0"/>
  <rect x="22" y="22" width="256" height="472" rx="18" fill="#c7b2ea"/>
  <rect x="22" y="22" width="256" height="472" rx="18" fill="url(#dots)"/>
  <g clip-path="url(#inner)">
    <circle cx="60" cy="90" r="70" fill="#ffd1dc" opacity="0.9"/>
    <circle cx="250" cy="430" r="80" fill="#b8e8d8" opacity="0.9"/>
    <circle cx="245" cy="95" r="42" fill="#fff3b0" opacity="0.95"/>
    <circle cx="55" cy="430" r="46" fill="#bfe3f7" opacity="0.95"/>
  </g>
  <rect x="22" y="22" width="256" height="472" rx="18" fill="none" stroke="#4a3b5c" stroke-width="4"/>
  <rect x="36" y="36" width="228" height="444" rx="12" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.9"/>

  <!-- crystal moon -->
  <g transform="translate(150 240)">
    <circle r="78" fill="#fff8f3" stroke="#4a3b5c" stroke-width="4"/>
    <circle r="78" fill="#ffd1dc" opacity="0.35"/>
    <path d="M -22 -58 A 62 62 0 1 0 40 44 A 48 48 0 1 1 -22 -58 Z" fill="#a98bd9" stroke="#4a3b5c" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="-34" cy="-40" rx="14" ry="7" fill="#ffffff" transform="rotate(-30 -34 -40)"/>
    <g fill="#fff3b0" stroke="#4a3b5c" stroke-width="3" stroke-linejoin="round">
      <path d="M 34 -36 l 6 14 l 15 2 l -11 10 l 3 15 l -13 -7 l -13 7 l 3 -15 l -11 -10 l 15 -2 z"/>
      <path d="M 48 14 l 4 9 l 10 1 l -7 7 l 2 10 l -9 -5 l -9 5 l 2 -10 l -7 -7 l 10 -1 z" transform="scale(0.8) translate(14 10)"/>
    </g>
    <circle cx="-48" cy="30" r="6" fill="#b8e8d8" stroke="#4a3b5c" stroke-width="3"/>
    <circle cx="20" cy="56" r="4.5" fill="#ffd1dc" stroke="#4a3b5c" stroke-width="3"/>
  </g>

  <!-- small stars -->
  <g fill="#ffffff" stroke="#4a3b5c" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 70 150 l 3 8 l 8 1 l -6 5 l 2 8 l -7 -4 l -7 4 l 2 -8 l -6 -5 l 8 -1 z"/>
    <path d="M 232 330 l 3 8 l 8 1 l -6 5 l 2 8 l -7 -4 l -7 4 l 2 -8 l -6 -5 l 8 -1 z"/>
    <path d="M 70 360 l 2 6 l 6 1 l -5 4 l 2 6 l -5 -3 l -5 3 l 2 -6 l -5 -4 l 6 -1 z"/>
    <path d="M 230 150 l 2 6 l 6 1 l -5 4 l 2 6 l -5 -3 l -5 3 l 2 -6 l -5 -4 l 6 -1 z"/>
  </g>

  <!-- corner ornaments -->
  <g fill="none" stroke="#4a3b5c" stroke-width="3" stroke-linecap="round">
    <path d="M 48 60 q 0 -12 12 -12"/>
    <path d="M 252 60 q 0 -12 -12 -12"/>
    <path d="M 48 456 q 0 12 12 12"/>
    <path d="M 252 456 q 0 12 -12 12"/>
  </g>
  <rect width="300" height="516" rx="24" fill="none" stroke="#4a3b5c" stroke-width="6"/>
